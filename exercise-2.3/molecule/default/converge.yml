---
- name: Converge
  hosts: all
  become: true
  vars:
    app_name: "test-app"
    app_port: 8080
    app_environment: "test"
    app_debug: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - nginx
          - python3
          - python3-pip
          - docker.io
          - curl
          - jq
        state: present

    - name: Ensure nginx is running
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Create application directory
      file:
        path: "/opt/{{ app_name }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Create nginx configuration
      template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/{{ app_name }}
        mode: '0644'
      notify: Reload nginx

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/{{ app_name }}
        dest: /etc/nginx/sites-enabled/{{ app_name }}
        state: link
      notify: Reload nginx

    - name: Ensure firewall allows HTTP
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Ensure firewall allows HTTPS
      ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Ensure ufw is enabled
      ufw:
        state: enabled

  handlers:
    - name: Reload nginx
      systemd:
        name: nginx
        state: reloaded
