# Recording Rules for Application Performance Intelligence
# Exercise 3.2: Application Performance Intelligence

groups:
  # HTTP Performance Rules
  - name: http_performance
    interval: 10s
    rules:
      # HTTP request rate per service
      - record: http:request_rate:rate1m
        expr: |
          sum by (service, method, status_code) (
            rate(http_requests_total[1m])
          )

      # HTTP error rate per service
      - record: http:error_rate:rate1m
        expr: |
          sum by (service, method) (
            rate(http_requests_total{status_code=~"5.."}[1m])
          ) / sum by (service, method) (
            rate(http_requests_total[1m])
          )

      # HTTP latency p50
      - record: http:latency_p50:histogram
        expr: |
          histogram_quantile(0.50,
            sum by (service, method, le) (
              rate(http_request_duration_seconds_bucket[5m])
            )
          )

      # HTTP latency p95
      - record: http:latency_p95:histogram
        expr: |
          histogram_quantile(0.95,
            sum by (service, method, le) (
              rate(http_request_duration_seconds_bucket[5m])
            )
          )

      # HTTP latency p99
      - record: http:latency_p99:histogram
        expr: |
          histogram_quantile(0.99,
            sum by (service, method, le) (
              rate(http_request_duration_seconds_bucket[5m])
            )
          )

      # HTTP latency standard deviation
      - record: http:latency_stddev:rate1m
        expr: |
          stddev_over_time(
            http:latency_p95:histogram[1h]
          )

      # HTTP latency mean
      - record: http:latency_mean:rate1m
        expr: |
          avg_over_time(
            http:latency_p95:histogram[1h]
          )

      # HTTP latency Z-score (anomaly score)
      - record: http:latency_anomaly_score:zscore
        expr: |
          (
            http:latency_p95:histogram
            - http:latency_mean:rate1m
          ) / (http:latency_stddev:rate1m > 0 or on() vector(1))

      # HTTP throughput (requests per second)
      - record: http:throughput:rps
        expr: |
          sum by (service) (
            rate(http_requests_total[1m])
          )

      # HTTP availability (success rate)
      - record: http:availability:ratio
        expr: |
          1 - (
            sum by (service) (
              rate(http_requests_total{status_code=~"5.."}[5m])
            ) / sum by (service) (
              rate(http_requests_total[5m])
            )
          )

  # Database Performance Rules
  - name: database_performance
    interval: 10s
    rules:
      # Database query rate
      - record: db:query_rate:rate1m
        expr: |
          rate(pg_stat_database_xact_commit_total[1m])
          + rate(pg_stat_database_xact_rollback_total[1m])

      # Database query latency
      - record: db:query_latency:rate1m
        expr: |
          rate(pg_stat_database_blks_hit_total[1m])
          / rate(pg_stat_database_blks_read_total[1m])

      # Database connection count
      - record: db:connections:count
        expr: |
          pg_stat_database_numbackends

      # Database transaction rate
      - record: db:transaction_rate:rate1m
        expr: |
          rate(pg_stat_database_xact_commit_total[1m])

      # Database rollback rate
      - record: db:rollback_rate:rate1m
        expr: |
          rate(pg_stat_database_xact_rollback_total[1m])

      # Database cache hit ratio
      - record: db:cache_hit_ratio:ratio
        expr: |
          pg_stat_database_blks_hit
          / (pg_stat_database_blks_hit + pg_stat_database_blks_read)

      # Database size
      - record: db:size:bytes
        expr: |
          pg_database_size_bytes

      # Database deadlocks
      - record: db:deadlocks:rate1m
        expr: |
          rate(pg_stat_database_deadlocks_total[1m])

  # Cache Performance Rules
  - name: cache_performance
    interval: 10s
    rules:
      # Redis hit rate
      - record: redis:hit_rate:ratio
        expr: |
          redis_keyspace_hits_total
          / (redis_keyspace_hits_total + redis_keyspace_misses_total)

      # Redis operations per second
      - record: redis:ops_rate:rate1m
        expr: |
          rate(redis_commands_processed_total[1m])

      # Redis memory usage
      - record: redis:memory_usage:bytes
        expr: |
          redis_memory_used_bytes

      # Redis connected clients
      - record: redis:connections:count
        expr: |
          redis_connected_clients

      # Redis latency
      - record: redis:latency:rate1m
        expr: |
          redis_commands_duration_seconds_total
          / redis_commands_processed_total

  # Message Queue Performance Rules
  - name: queue_performance
    interval: 10s
    rules:
      # Message publish rate
      - record: queue:publish_rate:rate1m
        expr: |
          rate(rabbitmq_queue_messages_published_total[1m])

      # Message consume rate
      - record: queue:consume_rate:rate1m
        expr: |
          rate(rabbitmq_queue_messages_delivered_total[1m])

      # Queue depth
      - record: queue:depth:count
        expr: |
          rabbitmq_queue_messages

      # Queue consumer count
      - record: queue:consumers:count
        expr: |
          rabbitmq_queue_consumers

      # Message latency
      - record: queue:latency:rate1m
        expr: |
          rate(rabbitmq_queue_message_bytes_total[1m])
          / rate(rabbitmq_queue_messages_total[1m])

  # User Behavior Rules
  - name: user_behavior
    interval: 30s
    rules:
      # Active users
      - record: user:active:count
        expr: |
          count by (service) (
            user_sessions_active
          )

      # Session duration
      - record: user:session_duration:avg
        expr: |
          avg by (service) (
            user_session_duration_seconds
          )

      # Page views per user
      - record: user:page_views:rate1m
        expr: |
          rate(user_page_views_total[1m])
          / count by (service) (user_sessions_active)

      # Error pages per user
      - record: user:error_pages:rate1m
        expr: |
          rate(user_error_pages_total[1m])
          / count by (service) (user_sessions_active)

      # User conversion rate
      - record: user:conversion_rate:ratio
        expr: |
          rate(user_conversions_total[5m])
          / rate(user_sessions_total[5m])

  # Deployment Performance Rules
  - name: deployment_performance
    interval: 30s
    rules:
      # Deployment frequency
      - record: deploy:frequency:rate1d
        expr: |
          count by (service) (
            increase(deployments_total[1d])
          )

      # Deployment success rate
      - record: deploy:success_rate:ratio
        expr: |
          count by (service) (
            deployments_total{status="success"}
          ) / count by (service) (
            deployments_total
          )

      # Deployment duration
      - record: deploy:duration:avg
        expr: |
          avg by (service) (
            deployment_duration_seconds
          )

      # Rollback rate
      - record: deploy:rollback_rate:ratio
        expr: |
          count by (service) (
            deployments_total{status="rollback"}
          ) / count by (service) (
            deployments_total
          )

  # Performance Regression Rules
  - name: performance_regression
    interval: 30s
    rules:
      # Detect latency increase
      - record: perf:latency_regression:detected
        expr: |
          http:latency_p95:histogram
          > http:latency_mean:rate1m + 2 * http:latency_stddev:rate1m

      # Detect error rate increase
      - record: perf:error_regression:detected
        expr: |
          http:error_rate:rate1m > 0.05

      # Detect throughput decrease
      - record: perf:throughput_regression:detected
        expr: |
          http:throughput:rps < (
            avg_over_time(http:throughput:rps[1h]) * 0.7
          )

      # Detect availability decrease
      - record: perf:availability_regression:detected
        expr: |
          http:availability:ratio < 0.99

  # Scaling Recommendation Rules
  - name: scaling_recommendations
    interval: 60s
    rules:
      # CPU scaling recommendation
      - record: scale:cpu_recommendation:action
        expr: |
          node:cpu_usage_rate:avg5m > 0.7

      # Memory scaling recommendation
      - record: scale:memory_recommendation:action
        expr: |
          node:memory_usage_rate:avg5m > 0.8

      # Database connection scaling
      - record: scale:db_connection_recommendation:action
        expr: |
          db:connections:count > 80

      # Cache scaling recommendation
      - record: scale:cache_recommendation:action
        expr: |
          redis:hit_rate:ratio < 0.9

      # Queue scaling recommendation
      - record: scale:queue_recommendation:action
        expr: |
          queue:depth:count > 1000

  # Health Scoring Rules
  - name: performance_health
    interval: 60s
    rules:
      # HTTP health score (0-100)
      - record: perf:health_score_http:score
        expr: |
          clamp(
            http:availability:ratio * 100,
            0, 100
          )

      # Database health score (0-100)
      - record: perf:health_score_db:score
        expr: |
          clamp(
            db:cache_hit_ratio:ratio * 100,
            0, 100
          )

      # Cache health score (0-100)
      - record: perf:health_score_cache:score
        expr: |
          clamp(
            redis:hit_rate:ratio * 100,
            0, 100
          )

      # Overall performance health score
      - record: perf:health_score_overall:score
        expr: |
          (
            perf:health_score_http:score * 0.4
            + perf:health_score_db:score * 0.3
            + perf:health_score_cache:score * 0.3
          )
