version: "3.9"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - appnet

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/appdb
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    logging: *default-logging
    networks:
      - appnet

volumes:
  pgdata:

networks:
  appnet:
    driver: bridge
