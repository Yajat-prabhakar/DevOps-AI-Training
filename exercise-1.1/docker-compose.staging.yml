version: "3.9"

services:
  backend:
    build:
      target: production
    environment:
      LOG_LEVEL: INFO
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  frontend:
    build:
      target: production
    ports:
      - "8080:80"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  postgres:
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped
