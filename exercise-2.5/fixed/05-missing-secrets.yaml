# FIX: Reference existing secrets and configmaps
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-missing-secrets
  namespace: app
  labels:
    app.kubernetes.io/name: backend-missing-secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-missing-secrets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-missing-secrets
    spec:
      containers:
        - name: backend
          image: app-backend:latest
          ports:
            - containerPort: 5000
          env:
            # FIXED: Reference existing secret
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets  # FIXED: Secret exists
                  key: password
            # FIXED: Reference existing configmap
            - name: APP_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: app-config  # FIXED: ConfigMap exists
                  key: config.json
            # FIXED: Reference correct secret key
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: api-key  # FIXED: Key exists
