# FIX: Added proper egress rules for DNS and internal communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-broken
  namespace: app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # FIXED: Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # FIXED: Allow internal pod communication
    - to:
        - podSelector: {}
    # FIXED: Allow external HTTPS (for API calls)
    - to: []
      ports:
        - protocol: TCP
          port: 443
