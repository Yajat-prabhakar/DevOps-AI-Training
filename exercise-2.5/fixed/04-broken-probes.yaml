# FIX: Correct probe paths and ports
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-broken-probes
  namespace: app
  labels:
    app.kubernetes.io/name: backend-broken-probes
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-broken-probes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-broken-probes
    spec:
      containers:
        - name: backend
          image: app-backend:latest
          ports:
            - containerPort: 5000
          # FIXED: Correct liveness probe
          livenessProbe:
            httpGet:
              path: /api/health  # FIXED: Correct path
              port: 5000         # FIXED: Correct port
            initialDelaySeconds: 30
            periodSeconds: 10
          # FIXED: Correct readiness probe
          readinessProbe:
            httpGet:
              path: /api/health  # FIXED: Correct path
              port: 5000         # FIXED: Correct port
            initialDelaySeconds: 5
            periodSeconds: 5
          # FIXED: Higher failureThreshold for startup
          startupProbe:
            httpGet:
              path: /api/health
              port: 5000
            failureThreshold: 30  # FIXED: Allow 300s for startup
            periodSeconds: 10
