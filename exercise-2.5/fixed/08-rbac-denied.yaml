# FIX: Add service account and RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: app
  labels:
    app.kubernetes.io/name: backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-role
  namespace: app
  labels:
    app.kubernetes.io/name: backend
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-rolebinding
  namespace: app
  labels:
    app.kubernetes.io/name: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-role
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-rbac-denied
  namespace: app
  labels:
    app.kubernetes.io/name: backend-rbac-denied
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-rbac-denied
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-rbac-denied
    spec:
      serviceAccountName: backend-sa  # FIXED: Use dedicated service account
      containers:
        - name: backend
          image: app-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  audience: api
