# FIX: Added resource limits and requests
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-no-resources
  namespace: app
  labels:
    app.kubernetes.io/name: backend-no-resources
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-no-resources
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-no-resources
    spec:
      containers:
        - name: backend
          image: app-backend:latest
          ports:
            - containerPort: 5000
          resources:  # FIXED: Added resource limits
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
