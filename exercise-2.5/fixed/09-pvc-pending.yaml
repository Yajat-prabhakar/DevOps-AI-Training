# FIX: Use existing PVC and storage class
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-pvc-pending
  namespace: app
  labels:
    app.kubernetes.io/name: backend-pvc-pending
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-pvc-pending
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-pvc-pending
    spec:
      containers:
        - name: backend
          image: app-backend:latest
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app-data-pvc
---
# FIXED: PVC with valid storage class
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data-pvc
  namespace: app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard  # FIXED: Use valid storage class
