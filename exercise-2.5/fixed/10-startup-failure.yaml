# FIX: Add init container to wait for database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-startup-failure
  namespace: app
  labels:
    app.kubernetes.io/name: backend-startup-failure
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-startup-failure
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-startup-failure
    spec:
      # FIXED: Init container to wait for database
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgresql 5432; do
                echo "Waiting for database..."
                sleep 2
              done
              echo "Database is ready!"
      containers:
        - name: backend
          image: app-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:password@postgresql:5432/appdb"
          # FIXED: Higher failureThreshold for startup
          startupProbe:
            httpGet:
              path: /api/health
              port: 5000
            failureThreshold: 30  # FIXED: Allow 300s for startup
            periodSeconds: 10
          # FIXED: Added readiness probe
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
# FIXED: PostgreSQL with persistent storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-broken
  namespace: app
  labels:
    app.kubernetes.io/name: postgresql-broken
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql-broken
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql-broken
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "appdb"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "password"
          # FIXED: Added persistent storage
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: postgresql-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pvc
  namespace: app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
