# BUG: Startup failure - DB not ready when app starts
# No init container to wait for database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-startup-failure
  namespace: app
  labels:
    app.kubernetes.io/name: backend-startup-failure
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-startup-failure
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-startup-failure
    spec:
      # BUG: No init container to wait for database
      # App will start before DB is ready
      containers:
        - name: backend
          image: app-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:password@postgresql:5432/appdb"
          # BUG: Startup probe fails too quickly
          # If DB takes long to initialize, app will be killed
          startupProbe:
            httpGet:
              path: /api/health
              port: 5000
            failureThreshold: 3  # BUG: Too low for cold start
            periodSeconds: 10
          # BUG: No readiness probe to prevent traffic before ready
          readinessProbe: null
---
# BUG: PostgreSQL deployment has no init container either
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-broken
  namespace: app
  labels:
    app.kubernetes.io/name: postgresql-broken
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql-broken
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql-broken
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "appdb"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "password"
          # BUG: No persistent storage
          # Data will be lost on pod restart
          volumeMounts: []
      volumes: []
