# BUG: Network policy blocks all traffic including DNS
# Pods won't be able to resolve service names
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-broken
  namespace: app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # BUG: No egress rules defined at all
  # This means:
  # 1. Pods cannot resolve DNS (kube-dns is blocked)
  # 2. Pods cannot reach external APIs
  # 3. Pods cannot communicate with each other
  # 4. Health checks from kubelet will fail
  ingress: []
  egress: []
