# BUG: Missing RBAC - pod can't access Kubernetes API
# Required for health checks and service discovery
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-rbac-denied
  namespace: app
  labels:
    app.kubernetes.io/name: backend-rbac-denied
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-rbac-denied
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-rbac-denied
    spec:
      # BUG: No serviceAccountName specified
      # Pod uses default service account which has no permissions
      # serviceAccountName: backend-sa  # Missing
      containers:
        - name: backend
          image: app-backend:latest
          ports:
            - containerPort: 5000
          env:
            # BUG: Tries to access Kubernetes API without permissions
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # BUG: Mounts service account token but no RBAC
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  audience: api
