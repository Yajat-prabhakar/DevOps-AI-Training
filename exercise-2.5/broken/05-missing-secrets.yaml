# BUG: References non-existent secrets
# Pods will fail to start with CreateContainerConfigError
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-missing-secrets
  namespace: app
  labels:
    app.kubernetes.io/name: backend-missing-secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-missing-secrets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-missing-secrets
    spec:
      containers:
        - name: backend
          image: app-backend:latest
          ports:
            - containerPort: 5000
          env:
            # BUG: References secret that doesn't exist
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: non-existent-secret  # BUG: Secret doesn't exist
                  key: password
            # BUG: References configmap that doesn't exist
            - name: APP_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: non-existent-config  # BUG: ConfigMap doesn't exist
                  key: config.json
            # BUG: References secret key that doesn't exist
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: non-existent-key  # BUG: Key doesn't exist
