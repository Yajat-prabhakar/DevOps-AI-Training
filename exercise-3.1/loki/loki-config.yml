# Loki Configuration for Log Aggregation
# Exercise 3.1: Enterprise Anomaly Detection System

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  wal:
    dir: /loki/wal
    enabled: true
    flush_check_period: 1s
    flush_op_timeout: 10s
    flush_op_rate: 15
    max_size: 512MB
    max_age: 1h
    num_retries: 10

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_cache_freshness_per_query: 10m
  split_queries_by_interval: 15m
  max_query_parallelism: 32
  max_query_series: 100000
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

chunk_store_config:
  max_look_back_period: 0s

table_manager:
  retention_deletes_enabled: false
  retention_period: 0s

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

analytics:
  reporting_enabled: false

# Loki Pipeline for Log Anomaly Detection
limits_config:
  # Custom pipeline stages for anomaly detection
  pipeline_stages:
    # Stage 1: Parse JSON logs
    - json:
        expressions:
          level: level
          message: message
          timestamp: timestamp
          service: service
          component: component

    # Stage 2: Extract metrics from logs
    - metrics:
        log_count:
          type: Counter
          description: "Total log count"
          source: level
          config:
            action: inc

    # Stage 3: Detect error patterns
    - match:
        selector: '{service="backend"}'
        stages:
          - regex:
              expression: '(?P<error_type>ERROR|FATAL|CRITICAL)'
          - labels:
              error_type:

    # Stage 4: Detect slow queries
    - match:
        selector: '{service="backend"} |~ "query"'
        stages:
          - regex:
              expression: 'duration=(?P<duration>\d+)ms'
          - metrics:
              query_duration:
                type: Histogram
                description: "Query duration in ms"
                source: duration
                config:
                  buckets: [10, 50, 100, 500, 1000, 5000]

    # Stage 5: Detect connection pool issues
    - match:
        selector: '{service="backend"} |~ "connection"'
        stages:
          - regex:
              expression: 'pool=(?P<pool_size>\d+)/(?P<max_size>\d+)'
          - metrics:
              connection_pool_usage:
                type: Gauge
                description: "Connection pool usage ratio"
                source: pool_size
                config:
                  source_labels: [pool_size, max_size]
                  action: calc

    # Stage 6: Anomaly scoring
    - match:
        selector: '{service="backend"}'
        stages:
          - labels:
              anomaly_score:
          - metrics:
              log_anomaly_score:
                type: Gauge
                description: "Log-based anomaly score"
                source: anomaly_score
                config:
                  action: set

# Alert rules for Loki
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true

# Prometheus metrics endpoint
analytics:
  reporting_enabled: false
  backend: prometheus
  prometheus_remote_write:
    enabled: true
    url: http://prometheus:9090/api/v1/write
